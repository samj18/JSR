# Default server port. The user can change it live from the UI (Apply button in the header),
# and their choice is saved to ~/.filebridge/settings.properties for next launch.
server.address=0.0.0.0
server.port=8080

server.tomcat.max-swallow-size=-1
server.tomcat.connection-timeout=60s
server.tomcat.max-http-form-post-size=-1
server.tomcat.max-http-request-header-size=64KB

spring.servlet.multipart.enabled=false
spring.mvc.async.request-timeout=-1

spring.main.banner-mode=off

logging.level.root=INFO
logging.level.com.filebridge=DEBUG

logging.file.name=${user.home}/.filebridge/logs/filebridge.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=5
