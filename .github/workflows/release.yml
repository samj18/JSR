name: Build installers

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            type: exe
            extra: --win-shortcut --win-menu --win-dir-chooser
          - os: macos-latest
            type: dmg
            extra: ""
          - os: ubuntu-latest
            type: deb
            extra: --linux-shortcut

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Windows only: jpackage needs the WiX Toolset to make an .exe
      - name: Install WiX (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install wixtoolset -y --no-progress
          $wix = (Resolve-Path "C:\Program Files (x86)\WiX Toolset*\bin" | Select-Object -First 1).Path
          $wix | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Build fat jar
        run: mvn -B clean package -DskipTests

      - name: Prepare jpackage input
        shell: bash
        run: |
          mkdir dist-input
          cp target/*.jar dist-input/
          rm -f dist-input/original-*.jar
          echo "JAR_NAME=$(ls dist-input)" >> $GITHUB_ENV
          echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Run jpackage
        shell: bash
        run: |
          jpackage --input dist-input --name FileBridge \
            --main-jar "$JAR_NAME" \
            --type ${{ matrix.type }} \
            --app-version "$VERSION" \
            --dest dist ${{ matrix.extra }}

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
